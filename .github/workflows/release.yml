name: Build Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -r requirements.txt
      - run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: cmd
        run: build_exe.bat
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $env:YOUTUBE_AI_STUDIO_SMOKE_TEST = "1"
          $env:YOUTUBE_AI_STUDIO_SMOKE_MARKER = "$env:RUNNER_TEMP\youtube-ai-studio-smoke-ok"
          $process = Start-Process "dist/YouTubeAIStudio/YouTubeAIStudio.exe" -PassThru
          for ($second = 0; $second -lt 180; $second++) {
            if (Test-Path $env:YOUTUBE_AI_STUDIO_SMOKE_MARKER) { break }
            if (Test-Path "$env:YOUTUBE_AI_STUDIO_SMOKE_MARKER.error") {
              Get-Content "$env:YOUTUBE_AI_STUDIO_SMOKE_MARKER.error"
              throw "Packaged application dependency import failed."
            }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $env:YOUTUBE_AI_STUDIO_SMOKE_MARKER)) {
            if (-not $process.HasExited) { $process.Kill() }
            throw "Packaged application did not complete dependency imports."
          }
      - name: Sign installer
        if: ${{ env.CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f certificate.pfx /p $env:CERTIFICATE_PASSWORD installer-output/YouTube-AI-Studio-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: installer-output/YouTube-AI-Studio-Setup.exe
          generate_release_notes: true
